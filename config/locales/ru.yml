  text_vacation_messages_info: "Отсутствия отображаются в обзоре, как подсказка при назначении задач, как бейдж рядом с именем и, при желании, как баннер вверху каждой страницы. Всегда только для тех людей, которых вы выбрали в поле «Видимость»."
  text_vacation_text_info: "Например, «Летний отпуск». Если отмечено «Добавить период» даты добавляются автоматически."
  text_vacation_visibility_info: "Применяется к баннеру, обзору, подсказке для назначенного и бейджу."
  text_vacation_recipients_info: "Используется только при заполненном поле «Выбранные пользователи и группы». Введите имя и выберите из подсказок."
  text_vacation_projects_info: "Используется только при заполненном поле «Участники выбранных проектов». Введите название проекта и выберите из подсказок."
  text_vacation_show_banner_info: "Без баннера отсутствие всё равно отображается в обзоре, подсказке для назначенного и бейдже."
  text_vacation_lead_days_info: "Показывать баннер за столько дней до начала отсутствия. 0 = с первого дня."
  text_vacation_preview_lead_info: "Отображается с %{date} и до начала отсутствия."
  text_vacation_allowed_groups_info: "Кто может вести свои отсутствия. Без выбора — любой вошедший пользователь. Администраторы всегда могут."
  text_vacation_manager_groups_info: "Участники этих групп могут вести отсутствия для любого пользователя, например лиды команд. Администраторы всегда могут."
  text_vacation_hint_days_info: "При назначении задачи также предупреждать об отсутствиях, начинающихся в течение этого числа дней. По умолчанию: 14."
  text_vacation_block_users_info: "Без выбора: все предстоящие отсутствия. Перечисляются только те отсутствия, которые видит пользователь."
